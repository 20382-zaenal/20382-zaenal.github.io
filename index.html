<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login || WWW.MALAS.COM</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="main.js"></script>
</head>
<body>
  <h1 class="h1-welcome">Welcome </h1>
  <p style="color:#6B7280; font-size:2.5vh; height:5vh;">Login to access your account </p>
  <br>
  <div class="main">
    <img src="jenal.jpg" >
    <br>
    <h1>Login</h1>
    <br>
    <div class="box-user">
    <i class="fa fa-user"></i>
    <input type="text" class="user" id="user" placeholder="username">
    </div>
    <br>
    <div class="box-pass">
    <i class="fa-solid fa-lock" ></i>
    <input type="password" class="pass" id="pass" placeholder="password">
    </div>
    <br>
    <button class="btn" id="btn" type="submit" onclick="login()">submit</button>
  </div>
</body>
</html>
